<style>
:root{--bg:#f3f4f6;--pn:#fff;--pn2:#f8f9fb;--tx:#1a1d23;--mut:#6a7280;--bd:#e2e5ea;--ac:#2a9d5c;--ac2:#e6f5ec;--in:#f1f3f6;--sh:0 1px 2px #0001,0 8px 24px #0002;color-scheme:light;box-sizing:border-box}

:root[data-theme="dark"]{--bg:#14151a;--pn:#1c1e24;--pn2:#22252c;--tx:#e9ebef;--mut:#8b919d;--bd:#2d3139;--ac:#4cc57a;--ac2:#1f3328;--in:#272a32;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:13px/1.45 -apple-system,"Segoe UI",Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx);display:grid;grid-template-rows:46px 1fr 26px;overflow:hidden}

button{background:var(--in);border:1px solid var(--bd);border-radius:7px;padding:5px 11px;cursor:pointer;transition:border-color .12s,background .12s}

select,input[type=text],input[type=number],input:not([type]),textarea{background:var(--in);border:1px solid var(--bd);border-radius:7px;padding:5px 8px;min-width:0}

.dd{display:none;position:absolute;left:0;top:34px;min-width:250px;background:var(--pn);border:1px solid var(--bd);border-radius:10px;box-shadow:var(--sh);padding:5px;z-index:200}

.form label{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:8px;margin:6px 0;font-size:12px;color:var(--mut)}.form input,.form select{width:100%;color:var(--tx)}

.row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.row button{flex:1}
.sw{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}.sw i{width:24px;height:24px;border-radius:6px;border:1px solid #0003;cursor:pointer;display:block}.sw i:hover{transform:scale(1.15)}.sw i.cur{outline:2px solid var(--ac);outline-offset:1px}
.badge{display:inline-block;padding:1px 7px;border-radius:99px;font-size:11px;font-weight:700}.ok{background:#d8f3e2;color:#14683a}.warn{background:#fde8d0;color:#8a4a07}.bad{background:#fbd9d9;color:#8c1c1c}
#sb{display:flex;gap:16px;align-items:center;padding:0 12px;background:var(--pn);border-top:1px solid var(--bd);font-size:11.5px;color:var(--mut)}
.fb{background:var(--pn);color:var(--tx);border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh);padding:16px;max-width:96vw;max-height:92vh;overflow:auto}
#fl,#tm,#st,#gv,#pe{background:#0a0c1090;backdrop-filter:blur(3px)}
#md{background:#0a0c1090}#md div{background:var(--pn);border-radius:14px;box-shadow:var(--sh)}
.gn{background:var(--pn)}.fb b{font-size:14px}
#log{left:50%;transform:translateX(-50%);bottom:40px;border-radius:8px}

#aip{bottom:40px}

.button{background:var(--btn,#6f6f6f);border:calc(var(--s)*2px) solid;border-color:var(--tl,#fff) var(--br,#373737) var(--br,#373737) var(--tl,#fff);color:var(--txt,#fff);text-shadow:calc(var(--s)*1px) calc(var(--s)*1px) #222}

.label{justify-content:flex-start}

.panel{background:var(--panel,#c6c6c6);border:calc(var(--s)*2px) solid;border-color:var(--tl,#fff) var(--br,#555) var(--br,#555) var(--tl,#fff);display:block}

.panel.nobg{background:none;border:0}

.fb{background:var(--pn);padding:10px;max-width:96vw;max-height:90vh;overflow:auto}

.gn{position:absolute;width:180px;height:90px;background:var(--pn);border:1px solid var(--ac);border-radius:6px}

.pq{right:-7px}

#gp{position:fixed;display:none;z-index:90;width:270px;max-height:50vh;overflow:auto;background:var(--pn);border:1px solid var(--ac);padding:4px}

.gn.action .gh{background:#2471a3}
#pxv{image-rendering:pixelated;border:1px solid var(--bd);background:repeating-conic-gradient(#999 0 25%,#bbb 0 50%) 0 0/12px 12px;cursor:crosshair;touch-action:none;margin-top:6px}

@keyframes swa{from{transform:rotate(25deg)}to{transform:rotate(-25deg)}}
@keyframes swb{from{transform:rotate(-25deg)}to{transform:rotate(25deg)}}

.mgi{display:flex;gap:3px;align-items:center;margin:2px 0;font-size:11px}
.mgi b{flex:1;overflow:hidden;text-overflow:ellipsis}

#db{position:fixed;top:56px;left:50%;transform:translateX(-50%);z-index:80;display:none;gap:4px;align-items:center;background:var(--pn);border:1px solid var(--ac);padding:4px 8px;flex-wrap:wrap}

.tab{padding:10px 8px;font-size:12.5px}

<script>
const $=id=>document.getElementById(id);let S=3,P,sel=null,hist=[],hi=-1,prev=false,n=0,drag=null;
const D={button:{width:120,height:20,text:"Button",texture:"",slice:4},label:{width:60,height:9,text:"Label",color:"#404040"},slot:{width:18,height:18,slotIndex:0,slotType:"container"},player:{width:48,height:72,scale:30,skin:"",pose:"idle",model:"steve"},panel:{width:100,height:60,bg:true,color:"",texture:"",slice:4,layout:"none",gap:2,pad:4,hug:false,children:[]},input:{width:100,height:16,text:"",placeholder:"Type...",maxLength:32},progress:{width:80,height:8,value:50,min:0,max:100},checkbox:{width:70,height:12,text:"Option",checked:false},image:{width:32,height:32,texture:""}};
const ACT=["","open_gui","close_gui","run_command","play_sound","send_message","set_variable","change_variable","give_item","call_function","custom_java_hook"];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function mk(t){return {type:t,id:t+"_"+(++n),x:8,y:8,visible:true,locked:false,enabled:true,events:{},...structuredClone(D[t])}}
function walk(l,f,p=null,d=0){for(const e of l){f(e,p,d,l);if(e.children)walk(e.children,f,e,d+1)}}
function find(id){let r=null;walk(P.elements,(e,p,d,l)=>{if(e.id===id)r={e,p,l}});return r}
function cur(){return sel&&find(sel)}
function blank(){return {format:1,minecraft:"1.20.1",loader:CFG.loader,theme:CFG.theme,screen:{id:"main_menu",width:CFG.sw,height:CFG.sh},elements:[],variables:[],functions:[]}}
function recount(){n=100;walk(P.elements,()=>n++)}
function addVar(){P.variables=P.variables||[];P.variables.push({name:"var"+(P.variables.length+1),type:"int",initialValue:0});push();renderVars()}
function deleteVar(idx){P.variables.splice(idx,1);push();renderVars()}
function renderVars(){const d=$("vars");if(!P.variables||P.variables.length===0){d.innerHTML="<p class=m style='padding:8px'>"+(window.i18n?.t("no_custom_variables")||"No custom variables defined.")+"</p>";return}
d.innerHTML=P.variables.map((v,i)=>`<div class=fr style="padding:4px;background:var(--pn2);border-radius:6px;margin-bottom:4px"><label>${window.i18n?.t("custom.name")||"Name"}<input type=text value="${esc(v.name)}" data-idx=${i} data-f=name></label><label>${window.i18n?.t("custom.type")||"Type"}<select data-idx=${i} data-f=type><option ${v.type==="int"?"selected":""}>int</option><option ${v.type==="boolean"?"selected":""}>boolean</option><option ${v.type==="String"?"selected":""}>String</option></select></label><label>${window.i18n?.t("custom.initial")||"Initial"}<input type=text value="${esc(String(v.initialValue))}" data-idx=${i} data-f=initialValue></label><button onclick="deleteVar(${i})" style="padding:2px 8px">×</button></div>`).join("")}
$("vars").onchange=ev=>{const t=ev.target;if(t.dataset.idx!==undefined){const v=P.variables[+t.dataset.idx];if(t.dataset.f==="name"){const n=t.value.replace(/\W/g,"_")||"var";if(!n){say(window.i18n?.t("custom.error_empty_name")||"Name cannot be empty");return}v.name=n}else if(t.dataset.f==="type"){v.type=t.value}else if(t.dataset.f==="initialValue"){if(v.type==="int"){const num=+t.value;if(isNaN(num)){say(window.i18n?.t("custom.error_invalid_int")||"Invalid integer value");t.value=v.initialValue;return}v.initialValue=num}else if(v.type==="boolean"){v.initialValue=t.value==="true"}else if(v.type==="String"){v.initialValue=t.value}}push();renderVars()}};
function addFunc(){P.functions=P.functions||[];P.functions.push({name:"func"+(P.functions.length+1),returnType:"void",params:[],body:"return;"});
push();renderFuncs()}
function deleteFunc(idx){P.functions.splice(idx,1);push();renderFuncs()}
function renderFuncs(){const d=$("funcs");if(!P.functions||P.functions.length===0){d.innerHTML="<p class=m style='padding:8px'>"+(window.i18n?.t("no_custom_functions")||"No custom functions defined.")+"</p>";return}
d.innerHTML=P.functions.map((f,i)=>`<div style="padding:4px;background:var(--pn2);border-radius:6px;margin-bottom:4px"><div class=fr><label>${window.i18n?.t("custom.name")||"Name"}<input type=text value="${esc(f.name)}" data-idx=${i} data-f=name></label><label>${window.i18n?.t("custom.return")||"Return"}<select data-idx=${i} data-f=returnType><option ${f.returnType==="void"?"selected":""}>void</option><option ${f.returnType==="int"?"selected":""}>int</option><option ${f.returnType==="boolean"?"selected":""}>boolean</option><option ${f.returnType==="String"?"selected":""}>String</option></select></label><button onclick="deleteFunc(${i})" style="padding:2px 8px">×</button></div><label>${window.i18n?.t("custom.parameters")||"Parameters (comma-separated: type name)"}<input type=text value="${esc(f.params.join(", "))}" data-idx=${i} data-f=params placeholder="${window.i18n?.t("custom.placeholder_params")||"e.g. int amount, String name"}"></label><label>${window.i18n?.t("custom.body")||"Body (Java code)"}<textarea data-idx=${i} data-f=body style="width:100%;height:60px;font:11px monospace">${esc(f.body)}</textarea></div>`).join("")}
$("funcs").onchange=ev=>{const t=ev.target;if(t.dataset.idx!==undefined){const f=P.functions[+t.dataset.idx];if(t.dataset.f==="name"){const n=t.value.replace(/\W/g,"_")||"func";if(!n){say(window.i18n?.t("custom.error_empty_name")||"Name cannot be empty");return}f.name=n}else if(t.dataset.f==="returnType"){f.returnType=t.value}else if(t.dataset.f==="params"){const raw=t.value;const parsed=raw.split(",").map(s=>s.trim()).filter(s=>s);const validTypes=["int","boolean","String","void","float","double","long"];const invalid=parsed.filter(p=>{const parts=p.split(/\s+/);if(parts.length!==2)return true;const[typ,name]=parts;if(!validTypes.includes(typ)||!/^[a-zA-Z_]\w*$/.test(name))return true;return false});if(invalid.length>0){say(window.i18n?.t("custom.error_invalid_param")||"Invalid parameter format. Use: type name (e.g. int amount)");t.value=f.params.join(", ");return}f.params=parsed}else if(t.dataset.f==="body"){f.body=t.value}push();renderFuncs()}};
function push(){hist=hist.slice(0,hi+1);hist.push(JSON.stringify(P));if(hist.length>120)hist.shift();hi=hist.length-1;if(CFG.autosave!==false)try{localStorage.setItem("mcgb",hist[hi])}catch(e){if(!push.w){push.w=1;say("Autosave disabled: project is too large for local storage. Save to file!")}}}
function undo(){if(hi>0){P=JSON.parse(hist[--hi]);fix()}}function redo(){if(hi<hist.length-1){P=JSON.parse(hist[++hi]);fix()}}
function fix(){if(sel&&!find(sel))sel=null;ui()}
function newP(){P=blank();sel=null;multi=new Set();$("cls").value=CFG.cls;hist=[];hi=-1;push();ui()}
function add(t,grid){let c=cur();if(c&&c.e.type==="panel"&&c.e.children.length&&c.e.children.every(k=>k.type==="slot"))c=c.p?find(c.p.id):null;const l=c&&c.e.type==="panel"?c.e.children:P.elements;let e=mk(t);if(t==="label"&&P.overlay&&/^(title|pause)$/.test(P.overlay.target))e.color="#ffffff";
 if(grid){e=mk("panel");e.id="grid_"+(++n);e.bg=false;e.width=grid[0]*18;e.height=grid[1]*18;e.x=7;e.y=grid[1]===1?141:83;let i=grid[1]>1?9:0;for(let r=0;r<grid[1];r++)for(let q=0;q<grid[0];q++){const s=mk("slot");s.x=q*18;s.y=r*18;s.slotIndex=i++;s.slotType="player";e.children.push(s)}}
 l.push(e);sel=e.id;push();ui()}
function del(){const c=cur();if(!c)return;c.l.splice(c.l.indexOf(c.e),1);sel=null;push();ui()}
function dup(){const c=cur();if(!c)return;const k=structuredClone(c.e);walk([k],e=>{e.id=e.type+"_"+(++n)});k.x+=8;k.y+=8;c.l.splice(c.l.indexOf(c.e)+1,0,k);sel=k.id;push();ui()}
function zoom(d){S=Math.max(2,Math.min(6,S+d));ui()}
function togglePrev(){prev=!prev;$("pv").textContent=prev?"■ Exit Preview":"▶ Preview";ui()}
function say(t){const l=$("log");l.textContent="▶ "+t;l.style.display="block";clearTimeout(say.t);say.t=setTimeout(()=>l.style.display="none",4500);if(!window.i18n)window.i18n={t:k=>k}}
const V={};
function cnd(c){if(!c)return true;const m=/^(\w+)\s*(>=|<=|==|!=|>|<)\s*(-?\d+)$/.exec(c.trim());if(!m)return true;const a=V[m[1]]||0,b=+m[3];return {">=":a>=b,"<=":a<=b,"==":a==b,"!=":a!=b,">":a>b,"<":a<b}[m[2]]}
function run(e,ev){(e.events[ev]||[]).forEach(a=>{if(!a.action||!cnd(a.cond))return;let m;if(a.action==="close_gui"&&prev)setTimeout(previewBack,0);if(a.action==="open_gui"&&prev){const si=screenIndexBy(a.target);if(si>=0)setTimeout(()=>previewOpen(si),0)}
 if(a.action==="set_variable"&&(m=/^(\w+)\s*=\s*(-?\d+)$/.exec(a.target||"")))V[m[1]]=+m[2];
 else if(a.action==="change_variable"&&(m=/^(\w+)\s*([+-])=\s*(\d+)$/.exec(a.target||"")))V[m[1]]=(V[m[1]]||0)+(m[2]==="-"?-1:1)*m[3];
 if(ev!=="tick"||/variable/.test(a.action))say(`${e.id}.${ev}: ${a.action} ${a.target||""}  vars=${JSON.stringify(V)}`)})}
/* canvas */
function draw(e,host){const d=document.createElement("div");d.className="n "+e.type+(e.id===sel||multi.has(e.id)?" sel":"")+(e.enabled?"":" off")+(e.type==="panel"&&e.bg===false?" nobg":"");
 d.style.cssText=`left:${e.x*S}px;top:${e.y*S}px;width:${e.width*S}px;height:${e.height*S}px;`+(e.visible?"":"opacity:.25;");d.dataset.id=e.id;if(e.id==="draw_layer"){d.style.pointerEvents="none";if(DW)d.style.visibility="hidden"}
 if(e.type==="label"){d.textContent=e.text;d.style.color=e.color}
 else if(e.type==="button")d.textContent=e.text;
 else if(e.type==="input"){if(prev){const i=document.createElement("input");i.value=e.text;i.placeholder=e.placeholder;i.maxLength=e.maxLength;i.oninput=()=>run(e,"change");d.append(i)}else d.textContent=e.text||e.placeholder}
 else if(e.type==="progress"){const i=document.createElement("i");i.style.width=Math.max(0,Math.min(100,(e.value-e.min)/((e.max-e.min)||1)*100))+"%";d.append(i)}
 else if(e.type==="checkbox"){const b=document.createElement("b");b.textContent=e.checked?"✓":"";d.append(b,e.text)}
 else if(e.type==="slot")d.title="slot "+e.slotIndex;
 else if(e.type==="image"){const a=(P.assets||{})[e.texture];if(a){d.style.backgroundImage=`url(${a})`;d.style.backgroundSize="100% 100%"}else d.textContent=e.texture||"image"}else if(e.type==="player")plyDraw(e,d);
 if((e.type==="panel"||e.type==="button")&&e.texture&&(P.assets||{})[e.texture]){const s=Math.max(1,e.slice||4);d.style.background="none";d.style.border=`${s*S}px solid transparent`;d.style.borderImage=`url(${P.assets[e.texture]}) ${s} fill / ${s*S}px stretch`}
 if(e.children)e.children.forEach(c=>draw(c,d));
 if(e.id===sel&&!prev){const t=document.createElement("div");t.className="tag";t.textContent=`${e.id}  x:${e.x} y:${e.y}  ${e.width}×${e.height}`;const h=document.createElement("div");h.className="h";d.append(t,h)}
 host.append(d)}
function canvas(){const g=$("gui");g.style.setProperty("--s",S);applyTheme(g);g.style.width=P.screen.width*S+"px";g.style.height=P.screen.height*S+"px";g.innerHTML="";refDraw(g);P.elements.forEach(e=>draw(e,g))}
$("gui").addEventListener("pointerdown",ev=>{const d=ev.target.closest(".n");if(!d){sel=null;multi=new Set();ui();return}const r=find(d.dataset.id);
 if(prev){if(ev.target.tagName==="INPUT")return;if(r.e.type==="checkbox"){r.e.checked=!r.e.checked;run(r.e,"change");canvas()}if(r.e.enabled){run(r.e,"press");run(r.e,"click")}return}
 sel=r.e.id;if(ev.shiftKey){multi.has(sel)&&multi.size>1?multi.delete(sel):multi.add(sel)}else if(!multi.has(sel))multi=new Set([sel]);const h=ev.target.closest(".h");drag=r.e.locked?null:{e:r.e,m:h?"r":"m",sx:ev.clientX,sy:ev.clientY,x:r.e.x,y:r.e.y,w:r.e.width,h:r.e.height,mv:false,grp:[...multi].map(i=>find(i)).filter(Boolean).map(c=>({e:c.e,x:c.e.x,y:c.e.y}))};ui()});
addEventListener("pointermove",ev=>{if(!drag)return;const q=$("sn").checked?(CFG.snap||4):1,sn=v=>Math.round(v/q)*q;let dx=Math.round((ev.clientX-drag.sx)/S),dy=Math.round((ev.clientY-drag.sy)/S);if(!dx&&!dy&&!drag.mv)return;drag.mv=true;
 if(drag.m==="m"){drag.grp.forEach(g=>{if(!g.e.locked){g.e.x=sn(g.x+dx);g.e.y=sn(g.y+dy)}})}else{drag.e.width=Math.max(1,sn(drag.w+dx));drag.e.height=Math.max(1,sn(drag.h+dy))}canvas();props()});
addEventListener("pointerup",()=>{if(drag&&drag.mv)push();drag=null});
addEventListener("keydown",ev=>{if(/INPUT|TEXTAREA|SELECT/.test(ev.target.tagName))return;const c=cur(),k=ev.key;

/* properties */

function screenIndexBy(t){const q=String(t||"").trim().toLowerCase();if(!q)return-1;ensureScreens();for(let i=0;i<P.screens.length;i++){const d=screenData(i);if(clsOf(i).toLowerCase()===q||String(d.name).toLowerCase()===q||(d.screen&&String(d.screen.id).toLowerCase()===q))return i}return-1}
function switchScreen(i){ensureScreens();if(i===P.cur||!P.screens[i])return;P.screen.cls=$("cls").value;
 const a=P.screens[P.cur];P.screens[P.cur]={name:a.name,custom:a.custom,screen:P.screen,elements:P.elements,overlay:P.overlay,container:P.container};
 const d=P.screens[i];P.screens[i]={name:d.name,custom:d.custom};P.cur=i;P.screen=d.screen;P.elements=d.elements;if(d.overlay)P.overlay=d.overlay;else delete P.overlay;if(d.container)P.container=true;else delete P.container;
 sel=null;multi=new Set();$("cls").value=P.screen.cls||defCls(d.name);if(!prev)push();ui();fitZoom()}
function buildKind(kind){if(kind.startsWith("ov:")){const k=kind.slice(3),t=OVT[k];return{name:KIND_NAME[kind],screen:{id:k,width:t.w,height:t.h,cls:t.n+"Additions"},elements:[],overlay:{on:true,target:k,anchor:t.a,custom:""}}}
 if(kind==="blank")return{name:KIND_NAME.blank,screen:{id:"custom",width:176,height:166},elements:[]};const b=tplBuild(kind);return{name:KIND_NAME[kind]||b.nm,screen:{id:b.nm.toLowerCase(),width:b.W,height:b.H,cls:b.nm+"Screen"},elements:b.E,container:true}}
function addScreen(kind){ensureScreens();const d=buildKind(kind),N=P.screens.map(s=>s.name);let nm=d.name,k=2;while(N.includes(nm))nm=d.name+" "+(k++);d.name=nm;d.custom=true;
 const ids=P.screens.map((_,i)=>String((screenData(i).screen||{}).id));let id=d.screen.id,j=2;while(ids.includes(id))id=d.screen.id+(j++);d.screen.id=id;
 const cs=P.screens.map((_,i)=>clsOf(i));let c=d.screen.cls||defCls(nm);j=2;const c0=c;while(cs.includes(c))c=c0+(j++);d.screen.cls=c;
 P.screens.push(d);switchScreen(P.screens.length-1)}
function deleteScreen(i){ensureScreens();if(P.screens.length<2)return say("At least one screen is required");if(i===P.cur)switchScreen(i>0?i-1:1);P.screens.splice(i,1);if(P.cur>i)P.cur--;push();ui()}
function deleteCur(){ensureScreens();if(P.screens.length<2)return say("At least one screen is required");if(confirm('Delete the screen "'+P.screens[P.cur].name+'"?'))deleteScreen(P.cur)}
function renameScreen(i,name){ensureScreens();P.screens[i].name=name;P.screens[i].custom=true;push();ui()}
function screensRender(){ensureScreens();const a=P.screens[P.cur];if(!a.custom)a.name=(P.overlay&&KIND_NAME["ov:"+P.overlay.target])||P.screen.id;
 $("stabs").innerHTML=P.screens.map((s,i)=>`<button class="stab${i===P.cur?" on":""}" data-i="${i}" title="Classe: ${esc(clsOf(i))}  ·  double click to rename">${esc(s.name)}${P.screens.length>1?`<span class="x" data-x="${i}" title="Delete">×</span>`:""}</button>`).join("")+`<button class="stab add" data-add="1">＋ Screen</button>`;fillMod()}
$("cls").onchange=()=>{P.screen.cls=$("cls").value;push();ui()};
$("stabs").onclick=ev=>{const x=ev.target.closest("[data-x]"),t=ev.target.closest(".stab");if(x){ev.stopPropagation();ensureScreens();const i=+x.dataset.x;if(confirm('Delete the screen "'+P.screens[i].name+'"?'))deleteScreen(i);return}if(!t)return;if(t.dataset.add)return openAddScreen();switchScreen(+t.dataset.i)};
$("stabs").ondblclick=ev=>{const t=ev.target.closest(".stab");if(!t||t.dataset.add)return;const i=+t.dataset.i,s=P.screens[i];t.innerHTML=`<input value="${esc(s.name)}" size="12">`;const inp=t.querySelector("input");let fin=false;inp.focus();inp.select();
 const done=()=>{if(fin)return;fin=true;const v=inp.value.trim();if(v)renameScreen(i,v);else screensRender()};inp.onkeydown=e=>{e.stopPropagation();if(e.key==="Enter")done();if(e.key==="Escape"){fin=true;screensRender()}};inp.onblur=done};
function openAddScreen(){const s=$("st");s.style.display="flex";s.innerHTML=`<div class=fb style="max-width:900px"><b>New screen</b> <button data-z=1>Close</button><p class=hint>The new screen is added to the project. To link it: select a button, choose the action <b>open_gui</b> and as target the class name of the screen.</p>${kindCards("ak")}</div>`}
/* generaction Java di tutte le schermate */
function genAllFiles(){ensureScreens();const base="src/main/java/"+$("pkg").value.replace(/\./g,"/")+"/",out=[],run=()=>{out.push({path:base+$("cls").value+".java",text:gen()});genExtra().forEach(f=>out.push({path:base+f.name+".java",text:f.text}))};
 if(P.screens.length<2){GENALL=false;run();return out}
 const keep={screen:P.screen,elements:P.elements,overlay:P.overlay,container:P.container},keepCls=$("cls").value;PSC=pscMap();GENALL=true;
 try{P.screens.forEach((_,i)=>{const d=screenData(i);P.screen=d.screen;P.elements=d.elements;if(d.overlay)P.overlay=d.overlay;else delete P.overlay;if(d.container)P.container=true;else delete P.container;$("cls").value=clsOf(i);if(i===P.cur)$("cls").value=keepCls;run()})}
 finally{GENALL=false;P.screen=keep.screen;P.elements=keep.elements;if(keep.overlay)P.overlay=keep.overlay;else delete P.overlay;if(keep.container)P.container=true;else delete P.container;$("cls").value=keepCls}
 return out}
/* preview with screen navigation */
function previewOpen(i){if(!prev||i===P.cur||!P.screens[i])return;walk(P.elements,e=>run(e,"close"));PSTACK.push(P.cur);switchScreen(i);walk(P.elements,e=>run(e,"open"))}
function previewBack(){if(!prev)return;if(PSTACK.length){walk(P.elements,e=>run(e,"close"));switchScreen(PSTACK.pop());walk(P.elements,e=>run(e,"open"))}else togglePrev()}
/* launch screen */
function launchOpen(){const l=$("launch");l.style.display="flex";l.innerHTML=`<div class="lw"><div class="lh"><svg width="44" height="44" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="4" fill="#2a9d5c"/><rect x="6" y="6" width="5" height="5" rx="1" fill="#fff"/><rect x="13" y="6" width="5" height="5" rx="1" fill="#fff" opacity=".7"/><rect x="6" y="13" width="5" height="5" rx="1" fill="#fff" opacity=".7"/><rect x="13" y="13" width="5" height="5" rx="1" fill="#fff"/></svg><div><h1>Minecraft GUI Builder</h1><p>What type of GUI do you want to create?</p></div></div>${kindCards("lk")}<div class="lf">${HAD_AUTO?'<button class="pri" data-lk="continue">▶ Continue last project</button>':""}${window.native?'<button data-lk="open">📂 Open a file…</button><button data-lk="mod">📁 Link to mod…</button>':""}<button data-lk="json">Open / paste JSON…</button><label class="lskip"><input type="checkbox" id="lskip" ${CFG.showLaunch===false?"checked":""}> Do not show on startup</label></div></div>`}
function showTutorial(){const t=$("tutorial");t.style.display="flex";const content=window.i18n?{title:window.i18n.t("tutorial.title"),welcome:window.i18n.t("tutorial.welcome"),step1_title:window.i18n.t("tutorial.step1_title"),step1:window.i18n.t("tutorial.step1"),step2_title:window.i18n.t("tutorial.step2_title"),step2:window.i18n.t("tutorial.step2"),step3_title:window.i18n.t("tutorial.step3_title"),step3:window.i18n.t("tutorial.step3"),step4_title:window.i18n.t("tutorial.step4_title"),step4:window.i18n.t("tutorial.step4"),step5_title:window.i18n.t("tutorial.step5_title"),step5:window.i18n.t("tutorial.step5"),close:window.i18n.t("tutorial.close"),skip:window.i18n.t("tutorial.skip")}:{title:"Welcome to Minecraft GUI Builder",welcome:"This tutorial will help you get started with creating Minecraft mod GUIs.",step1_title:"Getting Started",step1:"1. Choose a GUI type from the launch screen (Main Menu, Pause Menu, Inventory, or Custom Screen).",step2_title:"Adding Components",step2:"2. Drag components from the left panel (Components tab) onto the canvas. Available components include Buttons, Labels, Panels, Slots, and more.",step3_title:"Editing Properties",step3:"3. Select a component on the canvas to edit its properties in the right panel (Element tab). You can change position, size, text, colors, and events.",step4_title:"Generating Java Code",step4:"4. Click 'Generate Java' to export your GUI as Java code for Forge or NeoForge. Set your Mod ID, Package, and Screen class in the Project tab.",step5_title:"Saving and Loading",step5:"5. Use File → Open / save JSON to save your project. You can also use Ctrl+Z to undo and Ctrl+Y to redo.",close:"Got it!",skip:"Skip tutorial"};t.innerHTML=`<div id="tutorial-content"><h2>${content.title}</h2><p>${content.welcome}</p><div class="tutorial-step"><h3>${content.step1_title}</h3><p>${content.step1}</p></div><div class="tutorial-step"><h3>${content.step2_title}</h3><p>${content.step2}</p></div><div class="tutorial-step"><h3>${content.step3_title}</h3><p>${content.step3}</p></div><div class="tutorial-step"><h3>${content.step4_title}</h3><p>${content.step4}</p></div><div class="tutorial-step"><h3>${content.step5_title}</h3><p>${content.step5}</p></div><div id="tutorial-buttons"><button class="pri" onclick="closeTutorial()">${content.close}</button><button onclick="closeTutorial(true)">${content.skip}</button></div></div>`}
function closeTutorial(skip){localStorage.setItem("mcgb_tutorial","true");$("tutorial").style.display="none"}
$("launch").onclick=ev=>{if(ev.target.id==="lskip"){CFG.showLaunch=!ev.target.checked;saveCfg();return}const b=ev.target.closest("[data-lk]");if(b)launchPick(b.dataset.lk)};
function launchPick(k){const l=$("launch");l.style.display="none";if(k==="continue")return;if(k==="open")return nOpen();if(k==="mod"){linkMod();return switchTab("left","p-mod")}if(k==="json")return openJson();
 newP();if(k.startsWith("ov:"))setOverlay(k.slice(3));else if(k!=="blank")tplNew(k);switchTab("left","p-comp");
 say(k.startsWith("ov:")?"The dashed lines are Minecraft elements: add yours above, with the components on the left.":"Ready: drag components onto the canvas.")}
/* init */
try{const s=localStorage.getItem("mcgb");if(s){P=blank();P=normProject(JSON.parse(s));recount();hist=[JSON.stringify(P)];hi=0;HAD_AUTO=true}}catch(e){P=undefined}
if(!P)newP();else ui();if(CFG.showLaunch!==false)launchOpen();
const hasSeenTutorial=localStorage.getItem("mcgb_tutorial");
if(!hasSeenTutorial){setTimeout(()=>showTutorial(),500)}
</script></body></html>
